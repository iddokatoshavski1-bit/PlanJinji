// ---------- API helper ----------
async function api(path, { method = "GET", body, headers = {} } = {}) {
  const res = await fetch("/api" + path, {
    method,
    headers: { "Content-Type": "application/json", ...headers },
    body: body ? JSON.stringify(body) : undefined,
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || "Something went wrong — try again.");
  return data;
}

// ---------- multi-set countdown timer ----------
// Runs `sets` rounds of `seconds` back to back, beeping between each.
// Deadline-based (not tick-based) so it stays accurate if iOS throttles the tab.
function SetTimer({ seconds, sets, label }) {
  const total = Math.max(1, parseInt(sets) || 1);
  const per = Math.max(1, parseInt(seconds) || 0);

  const [setNo, setSetNo] = useState(1);
  const [left, setLeft] = useState(per);
  const [running, setRunning] = useState(false);
  const [finished, setFinished] = useState(false);
  const [prep, setPrep] = useState(0); // 3..1 "get ready" countdown before the very first set starts

  const deadline = useRef(null);
  const setNoRef = useRef(1);
  const ctxRef = useRef(null);
  const warnRef = useRef(0); // last countdown second we already beeped for, so we don't re-beep on every 200ms tick
  const beganRef = useRef(false); // true once the first set has actually started counting down

  // iOS only allows audio created/resumed inside a real tap, so we make the
  // AudioContext on the first Start press and reuse it for every later beep.
  function ensureAudio() {
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!ctxRef.current) ctxRef.current = new AC();
      if (ctxRef.current.state === "suspended") ctxRef.current.resume();
    } catch (e) { /* no audio, timer still works */ }
  }

  function beep(long) {
    const ctx = ctxRef.current;
    if (!ctx) return;
    try {
      const o = ctx.createOscillator();
      const g = ctx.createGain();
      o.connect(g); g.connect(ctx.destination);
      o.frequency.value = long ? 880 : 620;
      g.gain.setValueAtTime(0.3, ctx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + (long ? 0.8 : 0.25));
      o.start();
      o.stop(ctx.currentTime + (long ? 0.85 : 0.3));
    } catch (e) { /* ignore */ }
  }

  // "get ready" countdown — runs once before the very first set, then hands off to the real timer
  useEffect(() => {
    if (prep <= 0) return;
    beep(prep === 1);                                  // beep, beep, beeeep on the last tick
    const t = setTimeout(() => {
      if (prep === 1) {
        setPrep(0);
        warnRef.current = 0;
        beganRef.current = true;
        deadline.current = Date.now() + per * 1000;
        setRunning(true);
      } else {
        setPrep(prep - 1);
      }
    }, 1000);
    return () => clearTimeout(t);
  }, [prep, per]);

  useEffect(() => {
    if (!running) return;
    const id = setInterval(() => {
      const rem = Math.round((deadline.current - Date.now()) / 1000);
      if (rem > 0) {
        setLeft(rem);
        if (rem <= 3 && warnRef.current !== rem) {      // beep, beep, beeeep — 3 seconds warning before the set changes
          warnRef.current = rem;
          beep(rem === 1);
        }
        return;
      }

      if (setNoRef.current < total) {
        setNoRef.current += 1;
        setSetNo(setNoRef.current);
        deadline.current = Date.now() + per * 1000;
        setLeft(per);
        warnRef.current = 0;
      } else {
        clearInterval(id);
        setRunning(false);
        setFinished(true);
        setLeft(0);
      }
    }, 200);
    return () => clearInterval(id);
  }, [running, per, total]);

  function start() {
    ensureAudio();
    const isFreshStart = finished || !beganRef.current;
    if (isFreshStart) {                                 // first set (or restarting from the top) — 3s "get ready" first
      setNoRef.current = 1; setSetNo(1); setLeft(per); setFinished(false);
      warnRef.current = 0;
      beganRef.current = false;
      setPrep(3);
      return;
    }
    deadline.current = Date.now() + left * 1000;        // resume from where paused
    setRunning(true);
  }

  function reset() {
    setRunning(false); setFinished(false); setPrep(0);
    setNoRef.current = 1; setSetNo(1); setLeft(per);
    warnRef.current = 0;
    beganRef.current = false;
  }

  function skip() {
    if (setNoRef.current < total) {
      setNoRef.current += 1;
      setSetNo(setNoRef.current);
      deadline.current = Date.now() + per * 1000;
      setLeft(per);
      warnRef.current = 0;
    } else {
      setRunning(false); setFinished(true); setLeft(0);
    }
  }

  const mm = String(Math.floor(left / 60)).padStart(2, "0");
  const ss = String(left % 60).padStart(2, "0");

  return (
    <div style={{
      marginTop: 12, padding: "12px 14px", background: finished ? "#E8F5EC" : T.bg,
      border: "2px solid " + (finished ? T.good : T.ink), borderRadius: 12,
    }}>
      <div style={{ display: "flex", alignItems: "center", gap: 12, flexWrap: "wrap" }}>
        <span style={{
          fontFamily: fontStack, fontWeight: 900, fontSize: 30, letterSpacing: "-0.02em",
          color: finished ? T.good : T.ink, minWidth: 92,
        }}>{prep > 0 ? prep : `${mm}:${ss}`}</span>

        <div style={{ flex: 1, minWidth: 90 }}>
          <div style={{ fontSize: 12, fontWeight: 800, color: T.sub, marginBottom: 4 }}>
            {prep > 0 ? "GET READY…" : finished ? "ALL SETS DONE 🏆" : `SET ${setNo} OF ${total}`}
            {label ? ` · ${label}` : ""}
          </div>
          <div style={{ display: "flex", gap: 4 }}>
            {Array.from({ length: total }, (_, k) => (
              <span key={k} style={{
                height: 8, flex: 1, borderRadius: 999, border: "1px solid " + T.ink,
                background: finished || k + 1 < setNo ? T.good : (k + 1 === setNo ? T.accent : "#fff"),
              }} />
            ))}
          </div>
        </div>

        <div style={{ display: "flex", gap: 6 }}>
          <Btn small kind={running ? "ghost" : "accent"} disabled={prep > 0}
            onClick={() => (running ? setRunning(false) : start())}>
            {running ? "⏸" : prep > 0 ? `${prep}…` : finished ? "↺ Again" : "▶ Start"}
          </Btn>
          {!finished && <Btn small kind="ghost" onClick={skip} disabled={prep > 0}>⏭</Btn>}
          <Btn small kind="ghost" onClick={reset}>↺</Btn>
        </div>
      </div>
    </div>
  );
}

// ---------- XP / level helpers (doubling curve) ----------
// Each level needs 2× the previous: L1→L2 = 250, L2→L3 = 500, L3→L4 = 1000, ...
// Cumulative XP to *reach* level n = 250 * (2^(n-1) - 1)
function getXP(logs) {
  return (logs || []).length * 250;
}

function getLevel(xp) {
  return Math.floor(Math.log2((xp / 250) + 1)) + 1;
}

function levelInfo(xp) {
  const level = getLevel(xp);
  const start = 250 * (Math.pow(2, level - 1) - 1); // xp at the start of this level
  const need = 250 * Math.pow(2, level - 1);         // xp needed to reach the next level
  const into = xp - start;                            // xp earned inside this level
  return { level, into, need };
}

function getTitle(level) {
  const titles = ["Rookie", "Gym Rat", "Iron Wolf", "Barbarian", "Titan", "Legend"];
  return level >= 7 ? "Unstoppable" : (titles[level - 1] || "Unstoppable");
}

// ---------- per-set encoding ----------
// Per-set targets live INSIDE the standard reps/weight string fields, comma-separated:
//   reps = "10,8,6,4"   weight = "40,50,60,70"
function splitList(str) {
  return String(str || "").split(",").map((s) => s.trim()).filter((s) => s !== "");
}

function getSetDetails(ex) {
  if (Array.isArray(ex.setDetails) && ex.setDetails.length > 0) return ex.setDetails;
  const repsArr = splitList(ex.reps);
  const wArr = splitList(ex.weight);
  const n = Math.max(1, parseInt(ex.sets) || repsArr.length || wArr.length || 3);
  return Array.from({ length: n }, (_, j) => ({
    reps: repsArr[j] !== undefined ? repsArr[j] : (repsArr.length ? repsArr[repsArr.length - 1] : ""),
    weight: wArr[j] !== undefined ? wArr[j] : (wArr.length ? wArr[wArr.length - 1] : ""),
  }));
}

function detailsToFields(details) {
  return {
    sets: String(details.length),
    reps: details.map((s) => s.reps || "").join(","),
    weight: details.map((s) => s.weight || "").join(","),
  };
}

// ---------- metcon / block encoding ----------
// A block is a single exercise entry with sets === "block".
//   name   = block title (e.g. "Metcon")
//   weight = scheme (e.g. "AMRAP 12 min" / "21-15-9" / "3 rounds for time")
//   reps   = movements joined by " | " (e.g. "Thrusters 21 @ 40kg | Pull-ups 21")
//   rest   = rest seconds after the block
function isBlock(ex) {
  return String(ex.sets || "").toLowerCase().startsWith("block");
}
function decodeBlock(ex) {
  const setsStr = String(ex.sets || "");
  const roundsMatch = setsStr.match(/block:(\d+)/);
  return {
    title: ex.name || "Metcon",
    scheme: ex.weight || "",
    movements: String(ex.reps || "").split("|").map((s) => s.trimStart()),
    rest: ex.rest || "60",
    rounds: roundsMatch ? roundsMatch[1] : "1",
  };
}
function encodeBlock(b) {
  return {
    name: b.title || "Metcon",
    sets: "block:" + (parseInt(b.rounds) || 1),
    weight: b.scheme || "",
    reps: (b.movements || []).join(" | "),
    rest: b.rest || "60",
  };
}
function blockMinutes(ex) {
  const scheme = String(ex.weight || "");
  const m = scheme.match(/(\d+)\s*min/i);
  if (m) return parseInt(m[1]);
  const movs = decodeBlock(ex).movements.length || 3;
  const rMatch = scheme.match(/(\d+)\s*round/i);
  const rounds = rMatch ? parseInt(rMatch[1]) : 3;
  return Math.max(6, Math.round(movs * rounds * 0.8));
}

function estimateMinutes(exercises) {
  let sec = 0;
  for (const ex of exercises) {
   if (isBlock(ex)) {
  const rounds = parseInt(decodeBlock(ex).rounds) || 1;
  sec += (parseInt(ex.rest) || 0) * rounds;
  continue;
}
    const sets = getSetDetails(ex).length;
    const rest = parseInt(ex.rest) || 0;
    sec += sets * rest;
  }
  return Math.round(sec / 60);
}
// rest seconds → human string in minutes ("45s", "1:30 min", "2 min")
function formatRest(restSec) {
  const s = parseInt(restSec) || 0;
  if (!s) return "";
  if (s < 60) return s + "s";
  const m = Math.floor(s / 60);
  const rem = s % 60;
  return rem === 0 ? m + " min" : m + ":" + String(rem).padStart(2, "0") + " min";
}

// latest logged result for an exercise, matched by name (case-insensitive)
function lastWeightFor(logs, exName) {
  const target = String(exName || "").trim().toLowerCase();
  for (let i = (logs || []).length - 1; i >= 0; i--) {
    const hit = (logs[i].entries || []).find(
      (e) => String(e.exercise || "").trim().toLowerCase() === target && e.weightUsed
    );
    if (hit) return { weight: hit.weightUsed, date: logs[i].date, comment: hit.comment || "" };
  }
  return null;
}
// most recent weight the athlete themselves logged for this exercise AT THIS SAME REP COUNT —
// e.g. today's set is 3 reps, so find the last time they did 3 reps here, even if that was
// several weeks back and last week's sessions were all 8-rep sets. Own logged results only,
// never the coach's prescribed target weight.
function lastWeightForReps(logs, exName, targetReps) {
  const target = String(exName || "").trim().toLowerCase();
  const reps = String(targetReps || "").trim();
  if (!reps) return null;
  for (let i = (logs || []).length - 1; i >= 0; i--) {
    for (const e of logs[i].entries || []) {
      if (String(e.exercise || "").trim().toLowerCase() !== target) continue;
      const tokens = String(e.weightUsed || "").split("/").map((t) => t.trim()).filter(Boolean);
      for (const tok of tokens) {
        const m = tok.match(/^(.*?)×(.+)$/);
        if (m && m[1].trim() === reps) return { weight: m[2].trim(), date: logs[i].date };
      }
    }
  }
  return null;
}
// pulls a URL out of any text, returns { text, url }
function splitLink(str) {
  const s = String(str || "");
  const m = s.match(/(https?:\/\/\S+)/i);
  if (!m) return { text: s, url: null };
  return { text: s.replace(m[1], "").trim(), url: m[1] };
}

}

        method: "PUT", headers: coachHeaders(),
        body: { week: weekIdx + 1, day: d, title: src.days[d].title, exercises: src.days[d].exercises },

    }
    setCoachClient(latest);
    setWeekIdx(weekIdx + 1);
    setBusy(false);
  }

                    <input style={{ ...smallInput }} placeholder="How was it? (too heavy, easy, felt it in the knee…)"
                      value={comments[i] || ""}
                      onChange={(e) => { setComments({ ...comments, [i]: e.target.value }); setSavedExercises({ ...savedExercises, [i]: false }); }} />
                    <Btn small kind={savedExercises[i] ? "ghost" : "accent"} onClick={() => saveExercise(i)}>
                      {savedExercises[i] ? "Saved ✓" : "Save"}
                    </Btn>
                  </div>
                  {praise[i] && <PraiseBubble text={praise[i]} />}
                </Card>
              );
            })}

            <Card style={{ marginBottom: 14, padding: 18, background: T.accentSoft, borderColor: T.accentDark, boxShadow: "4px 4px 0 " + T.accentDark }}>
              <div style={{ fontSize: 14, fontWeight: 800, marginBottom: 12 }}>
                ⏱ Estimated session time: ~{estMin} minutes <span style={{ color: T.sub, fontWeight: 600 }}>(work + rest)</span>
              </div>
              <Field label="Overall — how was today's session?">
                <textarea style={{ ...inputStyle, minHeight: 60, resize: "vertical" }} value={sessionNote}
                  onChange={(e) => setSessionNote(e.target.value)} placeholder="Energy, soreness, anything the coach should know…" />
              </Field>
              <Btn kind="accent" onClick={handleFinishSession} disabled={busy}>
                {busy ? "Saving…" : isCurrentWorkout ? "Finish & send to coach" : "Finish this workout"}
              </Btn>
            </Card>
            </>)}
          </div>
        )}

        {lastLog && !saved && (
          <div style={{ color: T.sub, fontSize: 13, marginTop: 8 }}>
            Last session logged: {new Date(lastLog.date).toLocaleDateString()}
          </div>
        )}
      </div>
    );
  }

  // ---- COACH PIN ----
  if (screen === "coachPin")
    return shell(
      <Card>
        <div style={{ ...displayStyle, fontSize: 26, marginBottom: 6 }}>Coach access</div>
        <p style={{ color: T.sub, fontSize: 14, marginBottom: 20 }}>Enter your coach PIN.</p>
        <Field label="PIN">
          <input style={pinStyle} type="password" inputMode="numeric" maxLength={8} value={pinInput}
            onChange={(e) => setPinInput(e.target.value.replace(/\D/g, ""))}
            onKeyDown={(e) => e.key === "Enter" && handleCoachPin()} placeholder="••••••" autoFocus />
        </Field>
        <Btn onClick={handleCoachPin} disabled={busy}>{busy ? "Checking…" : "Open dashboard"}</Btn>
      </Card>
    );

  // ---- COACH DASHBOARD ----
  if (screen === "coach") {
    if (!coachClient)
      return shell(
        <div>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 16, flexWrap: "wrap", gap: 8 }}>
            <div style={{ ...displayStyle, fontSize: 30 }}>Clients</div>
            <Btn small kind="ghost" onClick={changeCoachPin}>Change coach PIN</Btn>
          </div>
          {clientList.length === 0 ? (
            <Card>
              <p style={{ color: T.sub, fontSize: 15, margin: 0 }}>
                No clients yet. Share the site link — when someone signs in with their name, they'll show up here.
              </p>
            </Card>
          ) : (
            clientList.map((c) => (
              <Card key={c.id} style={{ marginBottom: 12, padding: 16 }}>
                <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", gap: 10 }}>
                  <div onClick={() => openCoachClient(c.id)} style={{ ...displayStyle, fontSize: 17, cursor: "pointer", flex: 1 }}>{c.name}</div>
                  <span onClick={() => openCoachClient(c.id)} style={{ color: T.accent, fontWeight: 800, cursor: "pointer" }}>Open →</span>
                  <button onClick={(e) => { e.stopPropagation(); deleteClient(c.id, c.name); }}
                    title={`Delete ${c.name}`}
                    style={{ background: "#fff", border: "2px solid #C0392B", color: "#C0392B", borderRadius: 8, width: 30, height: 30, fontWeight: 900, cursor: "pointer", flexShrink: 0 }}>
                    ✕
                  </button>
                </div>
              </Card>
            ))
          )}
        </div>,
        { wide: true }
      );

    const p = coachClient.profile;
    const week = coachClient.plan.weeks[weekIdx];
    const day = week.days[Math.min(dayIdx, week.days.length - 1)];
    const progDone = coachClient.progress.week >= NUM_WEEKS;

    return shell(
      <div>
        <button onClick={() => setCoachClient(null)}
          style={{ background: "none", border: "none", color: T.sub, fontFamily: fontStack, fontSize: 13, cursor: "pointer", marginBottom: 10, textDecoration: "underline" }}>
          ← All clients
        </button>
        <div style={{ ...displayStyle, fontSize: 28, marginBottom: 4 }}>{p.name}</div>
        <div style={{ fontSize: 13, fontWeight: 800, color: T.accentDark, marginBottom: 14 }}>
          {progDone ? "🏆 Finished the 5-week program" : `Next up for them: Week ${coachClient.progress.week + 1}, workout ${coachClient.progress.day + 1} of ${p.frequency}`}
        </div>

        <Card style={{ marginBottom: 16, padding: 18 }}>
          <SectionLabel>Profile</SectionLabel>
          <div style={{ fontSize: 14, lineHeight: 1.7 }}>
            <strong>Goals:</strong> {p.goals}<br />
            <strong>Frequency:</strong> {p.frequency}×/week → {p.frequency} workout slots per week<br />
            <strong>Equipment:</strong> {p.facilities.join(", ")}<br />
            <strong>PIN:</strong> {p.pin ? p.pin : "not set yet"}{" "}
            {p.pin && (
              <button onClick={resetClientPin} style={{ background: "none", border: "none", color: T.accent, cursor: "pointer", fontWeight: 700, fontSize: 13, textDecoration: "underline" }}>
                reset (they'll pick a new one)
              </button>
            )}
          </div>
        </Card>

        <Card style={{ marginBottom: 16, padding: 18 }}>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", flexWrap: "wrap", gap: 8, marginBottom: 12 }}>
            <SectionLabel>5-week plan builder</SectionLabel>
            <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
              <Btn small kind="accent" onClick={aiSuggestWeek} disabled={aiBusy}>
                {aiBusy ? "🤖 Thinking…" : "✨ AI suggest this week"}
              </Btn>
              {weekIdx < NUM_WEEKS - 1 && (
                <Btn small kind="ghost" onClick={copyWeekForward} disabled={busy}>Copy → week {weekIdx + 2}</Btn>
              )}
            </div>
          </div>

          <div style={{ display: "flex", gap: 6, flexWrap: "wrap", marginBottom: 10 }}>
            {Array.from({ length: NUM_WEEKS }, (_, wi) => (
              <Tab key={wi} active={wi === weekIdx} onClick={() => { setWeekIdx(wi); setDayIdx(0); setExpandedEx(null); }}>
                Week {wi + 1}
              </Tab>
            ))}
          </div>
          <div style={{ display: "flex", gap: 6, flexWrap: "wrap", marginBottom: 14, paddingBottom: 12, borderBottom: "1px solid " + T.line }}>
            {week.days.map((dy, di) => (
              <Tab key={di} active={di === dayIdx} onClick={() => { setDayIdx(di); setExpandedEx(null); }}>
                {di + 1}. {dy.title} {dy.exercises.length ? `(${dy.exercises.length})` : "·"}
              </Tab>
            ))}
          </div>

          <Field label="Workout name">
            <input style={{ ...inputStyle, padding: "8px 12px", fontSize: 14 }} value={day.title}
              onChange={(e) => renameDay(e.target.value)}
              onBlur={() => saveDay(weekIdx, dayIdx, day.title, day.exercises)} />
          </Field>

          {day.exercises.length === 0 && (
            <p style={{ color: T.sub, fontSize: 14 }}>No exercises in this workout yet — add a single exercise or a metcon block below.</p>
          )}

          {day.exercises.map((ex, i) => {
            const open = expandedEx === i;
            const lastRes = lastWeightFor(coachClient.logs, ex.name);

            // ----- BLOCK row -----
            if (isBlock(ex)) {
              const b = decodeBlock(ex);
              return (
                <div key={i} style={{ borderBottom: "1px solid " + T.line, padding: "8px 0" }}>
                  <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", gap: 8 }}>
                    <div style={{ fontSize: 14 }}>
                      <span style={{ fontFamily: fontStack, fontWeight: 900, fontSize: 11, color: "#fff", background: T.accent, borderRadius: 5, padding: "2px 6px", marginRight: 6 }}>BLOCK</span>
                      <strong>{ex.name}</strong>{" "}
                      <span style={{ color: T.sub }}>{b.scheme}{ex.rest ? ` · rest ${formatRest(ex.rest)}` : ""}</span>
                    </div>
                    <div style={{ display: "flex", gap: 10, alignItems: "center" }}>
  <button onClick={() => moveExercise(i, -1)} title="Move up" style={{ background: "none", border: "none", color: T.ink, cursor: "pointer", fontWeight: 900, fontSize: 15 }}>↑</button>
  <button onClick={() => moveExercise(i, 1)} title="Move down" style={{ background: "none", border: "none", color: T.ink, cursor: "pointer", fontWeight: 900, fontSize: 15 }}>↓</button>
  <button onClick={() => setExpandedEx(open ? null : i)}
                        style={{ background: "none", border: "none", color: T.accent, cursor: "pointer", fontWeight: 700, fontSize: 13, textDecoration: "underline" }}>
                        {open ? "close" : "edit"}
                      </button>
                      <button onClick={() => removeExercise(i)} style={{ background: "none", border: "none", color: "#C0392B", cursor: "pointer", fontWeight: 700 }}>remove</button>
                    </div>
                  </div>
                  {!open && (
                    <div style={{ marginTop: 4, fontSize: 13, color: T.sub }}>
                      {b.movements.map((m, k) => <div key={k}>▸ {m}</div>)}
                    </div>
                  )}
                  {lastRes && (
                    <div style={{ marginTop: 4, fontSize: 13, fontWeight: 700, color: T.accentDark }}>
                      📈 Last logged ({new Date(lastRes.date).toLocaleDateString()}): {lastRes.weight}{lastRes.comment ? ` — "${lastRes.comment}"` : ""}
                    </div>
                  )}
                  {ex.draft && (ex.draft.weights.some(Boolean) || ex.draft.comment) && (
                    <div style={{ marginTop: 4, fontSize: 13, fontWeight: 700, color: T.accent }}>
                      📝 In progress: {ex.draft.weights.map((v) => v || "—").join(" / ") || "—"}{ex.draft.comment ? ` — "${ex.draft.comment}"` : ""}
                    </div>
                  )}
                  {open && (
                    <div style={{ marginTop: 8, background: T.bg, border: "1px solid " + T.line, borderRadius: 10, padding: "10px 12px" }}>
                      <div style={{ display: "grid", gridTemplateColumns: "1fr 80px 80px", gap: 8, marginBottom: 8 }}>
  <input style={{ ...smallInput }} placeholder="Scheme (AMRAP / 21-15-9)"
    value={b.scheme} onChange={(e) => updateBlockLocal(i, "scheme", e.target.value)} onBlur={persistCurrentDay} />
  <input style={{ ...smallInput }} placeholder="Rounds"
    value={b.rounds} onChange={(e) => updateBlockLocal(i, "rounds", e.target.value.replace(/\D/g, ""))} onBlur={persistCurrentDay} />
  <input style={{ ...smallInput }} placeholder="EMOM (s)"
    value={b.rest} onChange={(e) => updateBlockLocal(i, "rest", e.target.value.replace(/\D/g, ""))} onBlur={persistCurrentDay} />
</div>
                      {b.movements.map((m, k) => (
                        <div key={k} style={{ display: "grid", gridTemplateColumns: "1fr auto", gap: 8, alignItems: "center", marginBottom: 6 }}>
                          <input style={{ ...smallInput }} placeholder={`Movement ${k + 1} (e.g. Thrusters 21 @ 40kg)`}
                            value={m} onChange={(e) => updateBlockLocal(i, "movement", e.target.value, k)} onBlur={persistCurrentDay} />
                          <button onClick={() => blockRemoveMovement(i, k)} style={{ background: "none", border: "none", color: "#C0392B", cursor: "pointer", fontWeight: 700 }}>✕</button>
                        </div>
                      ))}
                      <div style={{ marginTop: 6 }}>
                        <Btn small kind="ghost" onClick={() => blockAddMovement(i)}>+ Add movement</Btn>
                      </div>
                    </div>
                  )}
                </div>
              );
            }

            // ----- normal exercise row -----
            const details = getSetDetails(ex);
            return (
              <div key={i} style={{ borderBottom: "1px solid " + T.line, padding: "8px 0" }}>
                <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", gap: 8 }}>
                  <div style={{ fontSize: 14 }}>
                    <strong>{ex.name}</strong>{" "}
                    <span style={{ color: T.sub }}>{details.length} sets{ex.rest ? ` · rest ${formatRest(ex.rest)}` : ""}</span>{" "}
                    {ex.link && (
                      <a href={ex.link} target="_blank" rel="noopener noreferrer"
                        style={{ fontSize: 11, fontWeight: 800, background: T.ink, color: "#fff", borderRadius: 6, padding: "2px 7px", textDecoration: "none" }}>
                        🔗 link
                      </a>
                    )}
                  </div>
                  <div style={{ display: "flex", gap: 10, alignItems: "center" }}>
  <button onClick={() => moveExercise(i, -1)} title="Move up" style={{ background: "none", border: "none", color: T.ink, cursor: "pointer", fontWeight: 900, fontSize: 15 }}>↑</button>
  <button onClick={() => moveExercise(i, 1)} title="Move down" style={{ background: "none", border: "none", color: T.ink, cursor: "pointer", fontWeight: 900, fontSize: 15 }}>↓</button>
  <button onClick={() => setExpandedEx(open ? null : i)}
                      style={{ background: "none", border: "none", color: T.accent, cursor: "pointer", fontWeight: 700, fontSize: 13, textDecoration: "underline" }}>
                      {open ? "close sets" : "edit sets"}
                    </button>
                    <button onClick={() => removeExercise(i)} style={{ background: "none", border: "none", color: "#C0392B", cursor: "pointer", fontWeight: 700 }}>remove</button>
                  </div>
                </div>
                {!open && (
                  <div style={{ marginTop: 4, fontSize: 13, color: T.sub }}>
                    {details.map((s, j) => (
                      <span key={j} style={{ marginRight: 10 }}>S{j + 1}: {s.reps || "—"}{s.weight ? ` 🏋️ ${s.weight}` : ""}</span>
                    ))}
                  </div>
                )}
                {lastRes && (
                  <div style={{ marginTop: 4, fontSize: 13, fontWeight: 700, color: T.accentDark }}>
                    📈 Last logged ({new Date(lastRes.date).toLocaleDateString()}): {lastRes.weight}{lastRes.comment ? ` — "${lastRes.comment}"` : ""}
                  </div>
                )}
                {ex.draft && (ex.draft.weights.some(Boolean) || ex.draft.comment) && (
                  <div style={{ marginTop: 4, fontSize: 13, fontWeight: 700, color: T.accent }}>
                    📝 In progress: {ex.draft.weights.map((v) => v || "—").join(" / ") || "—"}{ex.draft.comment ? ` — "${ex.draft.comment}"` : ""}
                  </div>
                )}
                {open && (
                  <div style={{ marginTop: 8, background: T.bg, border: "1px solid " + T.line, borderRadius: 10, padding: "10px 12px" }}>
                    <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8, marginBottom: 8 }}>
                      <input style={{ ...smallInput }} placeholder="Exercise name" value={ex.name}
                        onChange={(e) => updateExerciseField(i, "name", e.target.value)} onBlur={persistCurrentDay} />
                      <input style={{ ...smallInput }} placeholder="Demo link (optional, https://…)" value={ex.link || ""}
                        onChange={(e) => updateExerciseField(i, "link", e.target.value)} onBlur={persistCurrentDay} />
                    </div>
                   {details.map((s, j) => (
                      <div key={j} style={{ display: "grid", gridTemplateColumns: "auto 1fr 1fr 30px", gap: 8, alignItems: "center", marginBottom: 6 }}>
                        <span style={{ fontFamily: fontStack, fontWeight: 900, fontSize: 12, color: "#fff", background: T.ink, borderRadius: 6, padding: "4px 8px", whiteSpace: "nowrap" }}>SET {j + 1}</span>
                        <input style={{ ...smallInput }} placeholder="Reps" value={s.reps || ""}
                          onChange={(e) => updateSetDetail(i, j, "reps", e.target.value)} onBlur={persistCurrentDay} />
                        <input style={{ ...smallInput }} placeholder="Weight" value={s.weight || ""}
                          onChange={(e) => updateSetDetail(i, j, "weight", e.target.value)} onBlur={persistCurrentDay} />
                        <button onClick={() => { removeSet(i, j); persistCurrentDay(); }} title="Remove set"
                          style={{ background: "none", border: "none", color: "#C0392B", cursor: "pointer", fontWeight: 700 }}>✕</button>
                      </div>
                    ))}
                    <div style={{ display: "flex", gap: 8, alignItems: "center", marginTop: 8, flexWrap: "wrap" }}>
                      <Btn small kind="ghost" onClick={() => { addSet(i); persistCurrentDay(); }}>+ Add set</Btn>
                      <span style={{ fontSize: 12, fontWeight: 800, color: T.sub }}>Rest (s):</span>
                      <input style={{ ...smallInput, width: 90 }} placeholder="Rest (s)" value={ex.rest || ""}
                        onChange={(e) => updateRest(i, e.target.value.replace(/\D/g, ""))} onBlur={persistCurrentDay} />
                    </div>
                    <div style={{ fontSize: 12, color: T.sub, marginTop: 4 }}>Changes save automatically when you click out of a field.</div>
                  </div>
                )}
              </div>
            );
          })}

          {day.exercises.length > 0 && (
            <div style={{ marginTop: 8, fontSize: 13, fontWeight: 800, color: T.sub }}>
              ⏱ Estimated session: ~{estimateMinutes(day.exercises)} min
            </div>
          )}

          {/* add single exercise */}
          <div style={{ marginTop: 16, paddingTop: 14, borderTop: "1px solid " + T.line }}>
            <div style={{ fontSize: 12, fontWeight: 800, color: T.sub, marginBottom: 8 }}>ADD SINGLE EXERCISE</div>
            <div style={{ display: "grid", gridTemplateColumns: "2fr 1fr 1fr 1fr 1fr", gap: 8 }}>
              <input style={{ ...inputStyle, padding: "8px 10px", fontSize: 13 }} placeholder="Exercise" value={newEx.name} onChange={(e) => setNewEx({ ...newEx, name: e.target.value })} />
              <input style={{ ...inputStyle, padding: "8px 10px", fontSize: 13 }} placeholder="Sets" value={newEx.sets} onChange={(e) => setNewEx({ ...newEx, sets: e.target.value.replace(/\D/g, "") })} />
              <input style={{ ...inputStyle, padding: "8px 10px", fontSize: 13 }} placeholder="Reps" value={newEx.reps} onChange={(e) => setNewEx({ ...newEx, reps: e.target.value })} />
              <input style={{ ...inputStyle, padding: "8px 10px", fontSize: 13 }} placeholder="Weight" value={newEx.weight} onChange={(e) => setNewEx({ ...newEx, weight: e.target.value })} />
              <input style={{ ...inputStyle, padding: "8px 10px", fontSize: 13 }} placeholder="Rest (s)" value={newEx.rest} onChange={(e) => setNewEx({ ...newEx, rest: e.target.value.replace(/\D/g, "") })} />
            </div>
            <input style={{ ...inputStyle, padding: "8px 10px", fontSize: 13, marginTop: 8 }} placeholder="Demo link (optional, https://…) — keep this out of the exercise name"
              value={newEx.link} onChange={(e) => setNewEx({ ...newEx, link: e.target.value })} />
            <div style={{ fontSize: 12, color: T.sub, marginTop: 6 }}>
              Adds with sets + reps + weight as defaults, then use <strong>edit sets</strong> to fine-tune each set (pyramid: 10@40, 8@50, 6@60, 4@70).
            </div>
            <div style={{ marginTop: 10 }}>
              <Btn small kind="accent" onClick={addExercise}>+ Add exercise</Btn>
            </div>
          </div>

          {/* add metcon / block */}
          <div style={{ marginTop: 16, paddingTop: 14, borderTop: "1px solid " + T.line }}>
            {!showBlockForm ? (
              <Btn small kind="ghost" onClick={() => setShowBlockForm(true)}>⚡ Add metcon / circuit block</Btn>
            ) : (
              <div style={{ background: T.accentSoft, border: "2px solid " + T.accentDark, borderRadius: 12, padding: 14 }}>
                <div style={{ fontSize: 12, fontWeight: 800, color: T.accentDark, marginBottom: 10 }}>⚡ NEW METCON / CIRCUIT BLOCK</div>
                <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 70px 70px", gap: 8, marginBottom: 8 }}>
  <input style={{ ...smallInput }} placeholder="Block title (e.g. Metcon)" value={newBlock.title} onChange={(e) => setNewBlock({ ...newBlock, title: e.target.value })} />
  <input style={{ ...smallInput }} placeholder="Scheme (AMRAP / 21-15-9)" value={newBlock.scheme} onChange={(e) => setNewBlock({ ...newBlock, scheme: e.target.value })} />
  <input style={{ ...smallInput }} placeholder="Rounds" value={newBlock.rounds || ""} onChange={(e) => setNewBlock({ ...newBlock, rounds: e.target.value.replace(/\D/g, "") })} />
  <input style={{ ...smallInput }} placeholder="EMOM (s)" value={newBlock.rest} onChange={(e) => setNewBlock({ ...newBlock, rest: e.target.value.replace(/\D/g, "") })} />
</div>
                {newBlock.movements.map((m, k) => (
                  <div key={k} style={{ display: "grid", gridTemplateColumns: "1fr auto", gap: 8, alignItems: "center", marginBottom: 6 }}>
                    <input style={{ ...smallInput }} placeholder={`Movement ${k + 1} (e.g. Wall balls 15 @ 9kg)`} value={m} onChange={(e) => setNewBlockMovement(k, e.target.value)} />
                    <button onClick={() => removeNewBlockMovement(k)} style={{ background: "none", border: "none", color: "#C0392B", cursor: "pointer", fontWeight: 700 }}>✕</button>
                  </div>
                ))}
                <div style={{ display: "flex", gap: 8, marginTop: 8, flexWrap: "wrap" }}>
                  <Btn small kind="ghost" onClick={newBlockMovement}>+ Add movement</Btn>
                  <Btn small kind="accent" onClick={addBlock}>Save block</Btn>
                  <Btn small kind="ghost" onClick={() => { setShowBlockForm(false); setNewBlock({ title: "", scheme: "", rest: "", movements: [""] }); }}>Cancel</Btn>
                </div>
              </div>
            )}
          </div>
        </Card>

        <Card style={{ padding: 18 }}>
          <SectionLabel>Session feedback ({(coachClient.logs || []).length})</SectionLabel>
          {(coachClient.logs || []).length === 0 && (
            <p style={{ color: T.sub, fontSize: 14, margin: 0 }}>No logged sessions yet.</p>
          )}
          {[...(coachClient.logs || [])].reverse().map((log, i) => (
            <div key={i} style={{ padding: "10px 0", borderBottom: "1px solid " + T.line, fontSize: 14 }}>
              <div style={{ fontWeight: 800, marginBottom: 4 }}>
                {new Date(log.date).toLocaleString()}{log.week ? ` · Week ${log.week}, workout ${log.day}` : ""}
              </div>
              {log.sessionNote && <div style={{ marginBottom: 4 }}>"{log.sessionNote}"</div>}
              {(log.entries || []).filter((c) => c.comment || c.weightUsed).map((c, j) => (
                <div key={j} style={{ color: T.sub }}>
                  · {c.exercise}: {c.weightUsed ? <strong style={{ color: T.accentDark }}>{c.weightUsed}</strong> : ""}{c.weightUsed && c.comment ? " — " : ""}{c.comment}
                </div>
              ))}
            </div>
          ))}
        </Card>
      </div>,
      { wide: true }
    );
  }

  return shell(<Card>Loading…</Card>);
}

ReactDOM.createRoot(document.getElementById("root")).render(<PlanJinji />);
</script>
</body>
</html>
